name: LavaFast Cloudflare - testes de homologacao
on:
  push:
    branches:
      - feature/lavafast-cloudflare-homolog
      - feature/glowfleet-recuperacao-gmail
    paths:
      - 'lavafast-cloudflare/**'
      - '.github/workflows/lavafast-cloudflare-hml.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lavafast-cloudflare
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: lavafast-cloudflare/package-lock.json
      - name: Instalar sem atualizar lockfile
        run: npm ci
      - name: Executar testes offline
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee ../lavafast-hml-test-report.txt
      - name: Salvar diagnostico dos testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lavafast-hml-test-report
          path: lavafast-hml-test-report.txt
          if-no-files-found: warn
          retention-days: 7
